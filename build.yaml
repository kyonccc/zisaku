# GitHub Actions でビルドするファームウェアの一覧
# nice_nano//zmk = nice!nano v2 を ZMK 用の設定で使う、という意味
#
# トラックボールは右手に固定。
#   左手に kataware_left / 右手に kataware_right-trackball を書き込む
---
include:
  - board: nice_nano//zmk
    shield: kataware_left
    artifact-name: kataware_left
  # 右手 = トラックボール付き = PCとつながる側
  - board: nice_nano//zmk
    shield: kataware_right kataware_trackball
    artifact-name: kataware_right-trackball
  # 左右の接続がおかしくなった時用のリセットファームウェア
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
