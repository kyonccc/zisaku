# ===== ユーザー設定 =====
# 行頭の # を消すと有効になります

# Bluetooth の電波を強める (左右の接続が不安定な時に)
# ※ 2026年10月時点の ZMK main ではこの設定が反映されず警告になるため無効にしています
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 一定時間操作がないと完全に電源オフ(ディープスリープ)にする (ミリ秒, 30分)
# キーを押すと復帰する。持ち運び用途ならバッテリー節約に有効
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# トラックボールの反応が悪い/認識しない時に試す (電源投入時の待ち時間を延ばす)
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
