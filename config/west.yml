# ビルド時にダウンロードするソースコードの一覧
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
  projects:
    # ZMK 本体
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # トラックボールセンサー PMW3610 のドライバ
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main
  self:
    path: config
