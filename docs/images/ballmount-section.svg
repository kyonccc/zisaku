<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800" font-family="IPAPGothic, IPAGothic, sans-serif"><rect width="100%" height="100%" fill="#f7f7f5"/><text x="30" y="40" font-size="28" font-weight="bold" fill="#333">ボールユニットを「底からネジ止め」する断面イメージ</text><text x="30" y="72" font-size="17" fill="#666">ボールの中心を通る断面を手前から見た図。寸法は目安（部品の実測で決める）</text><rect x="30.0" y="620.0" width="930.0" height="20.0" fill="#d9dde3" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="30.0" y="497.0" width="50.0" height="123.0" fill="#d9dde3" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="80.0" y="512.0" width="60.0" height="15.0" fill="#f5b7b1" fill-opacity="0.9" stroke="#333" stroke-width="1.5"/><rect x="80.0" y="539.0" width="60.0" height="15.0" fill="#f5b7b1" fill-opacity="0.9" stroke="#333" stroke-width="1.5"/><rect x="80.0" y="497.0" width="60.0" height="15.0" fill="#d9dde3" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="80.0" y="554.0" width="20.0" height="66.0" fill="#d9dde3" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="80.0" y="527.0" width="100.0" height="12.0" fill="#c8b88a" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="100.0" y="549.0" width="80.0" height="16.0" fill="#2e7d32" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="540.0" y="527.0" width="420.0" height="12.0" fill="#c8b88a" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="540.0" y="549.0" width="420.0" height="16.0" fill="#2e7d32" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="595.0" y="477.0" width="150.0" height="72.0" fill="#ecf0f1" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="580.0" y="442.0" width="180.0" height="35.0" fill="#ffffff" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="620.0" y="565.0" width="90.0" height="18.0" fill="#d35400" fill-opacity="0.8" stroke="#333" stroke-width="1.5"/><text x="670.0" y="427.0" font-size="15" text-anchor="middle" fill="#666" font-weight="normal">キー</text><rect x="190.0" y="605.0" width="340.0" height="15.0" fill="#f3d6d2" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="190.0" y="390.0" width="25.0" height="230.0" fill="#f3d6d2" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="505.0" y="390.0" width="25.0" height="230.0" fill="#f3d6d2" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><path d="M190.0,390.0 L190.0,360.0 L257.0,330.0 L257.0,355.0 Z" fill="#b0bec5" stroke="#333" stroke-width="1.5"/><path d="M530.0,390.0 L530.0,360.0 L463.0,330.0 L463.0,355.0 Z" fill="#b0bec5" stroke="#333" stroke-width="1.5"/><rect x="260.0" y="589.0" width="200.0" height="16.0" fill="#2e7d32" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><rect x="315.0" y="559.0" width="90.0" height="30.0" fill="#90a4ae" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><circle cx="360.0" cy="410.0" r="125.0" fill="#c0392b" fill-opacity="0.88"/><text x="360.0" y="418.0" font-size="26" text-anchor="middle" fill="#fff" font-weight="bold">25mm</text><circle cx="252.0" cy="500.6" r="16.0" fill="#f0a500" stroke="#333" stroke-width="1.5"/><circle cx="468.0" cy="500.6" r="16.0" fill="#f0a500" stroke="#333" stroke-width="1.5"/><path d="M205.0,640.0 L245.0,640.0 L235.0,630.0 L235.0,580.0 L215.0,580.0 L215.0,630.0 Z" fill="#1a5276"/><rect x="207.0" y="575.0" width="36.0" height="45.0" fill="#b7950b" fill-opacity="0.5" stroke="#333" stroke-width="1"/><path d="M475.0,640.0 L515.0,640.0 L505.0,630.0 L505.0,580.0 L485.0,580.0 L485.0,630.0 Z" fill="#1a5276"/><rect x="477.0" y="575.0" width="36.0" height="45.0" fill="#b7950b" fill-opacity="0.5" stroke="#333" stroke-width="1"/><path d="M440.0,597.0 C580.0,610.0 560.0,605.0 595.0,591.0" fill="none" stroke="#d35400" stroke-width="3"/><rect x="575.0" y="565.0" width="50.0" height="26.0" fill="#d35400" fill-opacity="1.0" stroke="#333" stroke-width="1.5"/><line x1="190.0" y1="472.0" x2="180.0" y2="472.0" stroke="#c0392b" stroke-width="3"/><text x="185.0" y="462.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="normal">1mm</text><text x="30" y="125" font-size="19" fill="#333">① 基板とプレートは ガスケットで浮いている → 押すと上下に少し動く</text><text x="30" y="155" font-size="19" fill="#333">② ボールユニットは ケースの底にネジ止め → 動かない</text><text x="30" y="185" font-size="19" fill="#c0392b">③ ユニットと穴のあいだに すき間 約1mm → 基板が動いてもユニットに当たらない</text><line x1="965.0" y1="340.0" x2="995.0" y2="335.0" stroke="#666" stroke-width="1"/><text x="1000.0" y="340.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">上カバー（ボールが外れないように押さえる）</text><line x1="965.0" y1="512.0" x2="995.0" y2="507.0" stroke="#666" stroke-width="1"/><text x="1000.0" y="512.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">ガスケット（ピンク）とプレート</text><line x1="965.0" y1="559.0" x2="995.0" y2="554.0" stroke="#666" stroke-width="1"/><text x="1000.0" y="559.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">基板（緑・厚さ1.6mm）</text><line x1="965.0" y1="589.0" x2="995.0" y2="584.0" stroke="#666" stroke-width="1"/><text x="1000.0" y="589.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">ケーブルは たるませて つなぐ（基板が動いても引っぱらない）</text><line x1="965.0" y1="593.0" x2="995.0" y2="610.0" stroke="#666" stroke-width="1"/><text x="1000.0" y="615.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">PMW3610 センサー（ユニットの底・上向き）</text><line x1="965.0" y1="634.0" x2="995.0" y2="636.0" stroke="#666" stroke-width="1"/><text x="1000.0" y="641.0" font-size="16" text-anchor="start" fill="#666" font-weight="normal">裏から 皿ネジ M2 × 3本（ゴム足の間）→ ユニット底のインサートへ</text><line x1="-20.0" y1="640.0" x2="980.0" y2="640.0" stroke="#333" stroke-width="2"/><text x="0.0" y="662.0" font-size="15" text-anchor="start" fill="#666" font-weight="normal">机</text><text x="30" y="700" font-size="18" font-weight="bold" fill="#333">25mm ⇔ 19mm の付け替え（ユニットごと交換・外径34mmとネジ位置は共通）</text><text x="30" y="726" font-size="16" font-weight="normal" fill="#333">1. ボールを上から取り出す　2. 裏のネジ3本を外す</text><text x="30" y="752" font-size="16" font-weight="normal" fill="#333">3. ユニットを上に少し持ち上げ、センサー側のケーブルを抜く　4. もう一方のユニットを入れて逆の順番でとめる</text></svg>