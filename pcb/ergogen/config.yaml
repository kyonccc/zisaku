# kataware — Ergogen 設定 (基板・プレートの下書き)
#
# 使い方:
#   npx ergogen@4.1.0 pcb/ergogen -o pcb/ergogen/output
#
# 座標の決まり:
#   - 1キー = 19.05mm (kx, ky)。y は上がプラス (Ergogen の決まり)
#   - 左手は Q の列・親指の段 (left_c0_thumb) が原点
#   - 右手は左手と重ならないよう x = rx の位置に置く
#
# スイッチは Kailh Choc v2 (ロープロファイル) のみ。ホットスワップ
# (MX と Choc はソケットの穴が重なり同じ基板に載せられないため、Choc に絞った)
#
# 部品データ:
#   footprints/kataware/  … kataware 用に作ったもの (販売可能。Ergogen 内蔵 (MIT) をもとにしたものを含む)
#   footprints/ceoloide/  … ceoloide/ergogen-footprints から取り込んだ MIT ライセンスのもの
#   footprints/lib/      … KiCad 標準ライブラリ・Seeed 公式のフットプリントを変換したもの (tools/import_footprints.py)
#   footprints/box.js    … kataware 用の補助部品

meta:
  engine: 4.1.0
  name: kataware
  version: 0.1
  author: kyonccc

units:
  kx: 19.05
  ky: 19.05
  wall: 5        # ケースの縁
  corner: 14     # 外周の角の丸み
  rx: 200        # 右手の原点 (マイコン列の中心)
  # --- ガスケットマウント用 ---
  xiao_y: 38.5   # XIAO の中心の高さ (親指の段から)。USB-C は内側の側面に出す。ボールの穴に当たらない高さ
  ball_x: -8     # 右手のボールの中心 (Y の列の左隣 [ ] の列が 0)。これより右は N・Enter のキーキャップに当たる
  ball_y: 11     # 同じく親指の段から。これより上は ] のキーキャップに当たる
  pwr_y: 52.5    # 電源スイッチの中心の高さ (親指の段から)。浮島: スイッチのカバーが XIAO の端に重ならない高さ
  tab_w: 8       # プレートの耳 (ガスケットで挟む所) の幅

points:
  zones:
    # ===== 左手: 5列 x 4段 + T・G の右 (c5) + 親指の段の内側 (c5, c6) =====
    left:
      key:
        spread: kx
        padding: ky
        width: kx
        height: ky
      columns:
        c0.key.column_net: COL0
        c1.key.column_net: COL1
        c2.key.column_net: COL2
        c3.key.column_net: COL3
        c4.key.column_net: COL4
        c5:
          key.column_net: COL5
          rows.bottom.skip: true      # ここはエンコーダー
        c6:
          key.column_net: COL6
          rows:
            bottom.skip: true
            home.skip: true
            top.skip: true            # 親指の段 (Raise) だけ
      rows:
        thumb.row_net: ROW3
        bottom.row_net: ROW2
        home.row_net: ROW1
        top.row_net: ROW0

    # ===== 右手: Y・H の左 (e) + 5列 x 4段。e のさらに内側がマイコン列、その下がボール =====
    right:
      anchor.shift: [rx + kx, 0]
      key:
        spread: kx
        padding: ky
        width: kx
        height: ky
      columns:
        e:
          key.column_net: COL7
          rows:
            thumb.skip: true
            bottom.skip: true
        c8.key.column_net: COL8
        c9.key.column_net: COL9
        c10.key.column_net: COL10
        c11.key.column_net: COL11
        c12.key.column_net: COL12
      rows:
        thumb.row_net: ROW3
        bottom.row_net: ROW2
        home.row_net: ROW1
        top.row_net: ROW0

outlines:
  # ===== 考え方 (ガスケットマウント) =====
  #   board   … ケースの外形 (143.35 x 86.2mm, 角 R14)
  #   cavity  … ケースの内側 (キーの範囲ちょうど 133.35 x 76.2mm, 角 R5)。左右とも同じ形 (ボールは内側に収まる)
  #   pcb     … 基板。内側より 0.75mm 小さい。ソケットのパッドが端まで来る所だけ壁の溝に入る
  #             内側の側面に XIAO・電源スイッチ用の「舌」が出る
  #   plate   … プレート。内側より 0.5mm 小さく、6か所の「耳 (タブ)」が壁の溝に入る
  #             耳を上下からガスケット (ポロン) で挟んで浮かせる
  #   top_opening … トップケースの開口。キーキャップが当たらないよう内側より 0.75mm 大きい

  # --- 外形 (左右同じ大きさ) ---
  board_left:
    - what: rectangle
      where: left_c0_thumb
      adjust.shift: [3kx, 1.5ky]
      size: [7kx + 2wall, 4ky + 2wall]
      corner: corner
  board_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [2kx, -1.5ky]
      size: [7kx + 2wall, 4ky + 2wall]
      corner: corner

  # --- ボールまわり ---
  ball_hole:            # 基板・プレートの穴。ボールユニット (外径34mm) + すき間1mm
    - what: circle
      where: right_e_top
      adjust.shift: [ball_x, ball_y - 3ky]
      radius: 18
  ball_cut:             # 穴 + 穴より左下の角 (ここには部品がないので切り落とす)
    - name: ball_hole
    - what: rectangle
      where: right_e_top
      adjust.shift: [ball_x - 20, ball_y - 3ky - 15]
      size: [40, 30]

  # --- ケースの内側・トップケースの開口 ---
  cavity_left:
    - what: rectangle
      where: left_c0_thumb
      adjust.shift: [3kx, 1.5ky]
      size: [7kx, 4ky]
      corner: 5
  cavity_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [2kx, -1.5ky]
      size: [7kx, 4ky]
      corner: 5
  top_opening_left:
    - what: rectangle
      where: left_c0_thumb
      adjust.shift: [3kx, 1.5ky]
      size: [7kx + 1.5, 4ky + 1.5]
      corner: 3.5
  top_opening_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [2kx, -1.5ky]
      size: [7kx + 1.5, 4ky + 1.5]
      corner: 3.5

  # --- 穴・窓 ---
  encoder_cut:          # エンコーダー本体の逃げ (プレート用)
    - what: rectangle
      where: left_c5_top
      adjust.shift: [0.5kx, -2ky]
      size: [13, 13]
  view_window_left:     # nice!view の窓 (36 x 14mm + 余裕)
    - what: rectangle
      where: left_c6_thumb
      adjust.shift: [0, 2.5ky]
      size: [14.6, 36.6]
      corner: 1
  view_window_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [-kx, -0.5ky]
      size: [14.6, 36.6]
      corner: 1
  view_cut_left:        # プレート用: nice!view のところは角ごと切り取る (細い板が残ると折れやすいため)
    - what: rectangle
      where: left_c6_thumb
      adjust.shift: [3.5, 2.5ky + 1.375]  # nice!view のカバー (外 16.4 × 38.4mm) が入る大きさ
      size: [24.4, 42]
      corner: 1
  view_cut_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [-22.7, -0.5ky + 1.375]
      size: [24.7, 42]
      corner: 1
  plate_trim_right:     # プレート用: ボールの穴と nice!view の切り取りのあいだに残る細い板 (幅 2mm) を落とす
    - what: rectangle
      where: right_e_top
      adjust.shift: [-28.05, -39.15]
      size: [12, 26]
  keys_choc:            # Choc v2 用プレートのスイッチ穴 (13.8mm 角)
    - what: rectangle
      where: true
      size: [13.8, 13.8]

  # --- 基板の外形 ---
  # 基本は内側より 0.75mm 小さい (ガスケットで動いても壁に当たらない)。
  # ソケットのパッドが端まで来る列 (右手の一番外側・左手の Raise) だけ、細い帯を壁の溝へ 0.5mm 出す。
  # 内側の側面には XIAO の USB-C と電源スイッチ用の「舌」を出す。
  pcb_left:
    - what: rectangle
      where: left_c0_thumb
      adjust.shift: [3kx, 1.5ky]
      size: [7kx - 1.5, 4ky - 1.5]
      corner: 4.25
    - what: rectangle         # Raise のソケット用の帯
      where: left_c6_thumb
      adjust.shift: [0.5kx - 0.25, 4.5]
      size: [1.5, 7]
    - what: rectangle         # 内側の舌 (XIAO の USB-C と電源スイッチを側面に出す)
      where: left_c6_thumb
      adjust.shift: [0.5kx, 42.3]
      size: [6, 29.4]
  pcb_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [2kx, -1.5ky]
      size: [7kx - 1.5, 4ky - 1.5]
      corner: 4.25
    - what: rectangle         # 一番外側の列のソケット用の帯
      where: right_e_top
      adjust.shift: [5.5kx - 0.25, 32 - 3ky]
      size: [1.5, 62]
    - what: rectangle
      where: right_e_top
      adjust.shift: [-1.5kx, 42.3 - 3ky]
      size: [6, 29.4]
    - operation: subtract
      name: ball_cut

  # --- プレート (キースイッチを固定する板) ---
  # 浮島: プレートはスイッチで基板にくっついて、基板といっしょに浮く。耳もネジ穴も無い
  plate_left:
    - what: rectangle
      where: left_c0_thumb
      adjust.shift: [3kx, 1.5ky]
      size: [7kx - 1, 4ky - 1]
      corner: 4.5
    - {operation: subtract, name: keys_choc}
    - {operation: subtract, name: encoder_cut}
    - {operation: subtract, name: view_cut_left}
  plate_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [2kx, -1.5ky]
      size: [7kx - 1, 4ky - 1]
      corner: 4.5
    - {operation: subtract, name: keys_choc}
    - {operation: subtract, name: ball_cut}
    - {operation: subtract, name: view_cut_right}
    - {operation: subtract, name: plate_trim_right}

pcbs:
  # ===================== 左手 =====================
  left:
    template: kicad8
    outlines:
      edge:
        outline: pcb_left
        layer: Edge.Cuts
    footprints:
      switch:
        what: kataware/choc_v2_hotswap
        where: /^left_/
        params: &switch_params
          from: "{{column_net}}"
          to: "{{name}}"
      diode:
        what: diode
        where: /^left_/
        adjust.shift: [2, -5]       # 右へ 2mm: スイッチの位置決め穴 (左下) をよける
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      encoder:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: left_c5_top
        adjust.shift: [0.5kx, -2ky]
        params:
          S1: COL5
          S2: ENC_SW
          A: ENC_A
          B: GND
          C: ENC_B
      encoder_diode:
        what: diode
        where: left_c5_top
        adjust.shift: [0.5kx - 9, -2ky - 9.2]   # 浮島: 柱 (ナット) をよけて左へ 9mm
        params:
          from: ENC_SW
          to: ROW2
      xiao:               # 基板の裏側。KiCad で Seeed 公式フットプリントに置き換える (仮)
        what: lib/xiao_nrf52840_plus   # Seeed 公式の XIAO nRF52840 Plus (SMD・基板の裏)
        where: left_c6_thumb
        adjust:                 # 横向き。USB-C を内側の側面 (右) に出す
          shift: [0.5kx - 8, xiao_y]
          rotate: 0
        params:
          side: B
          D0: ROW0
          D1: ROW1
          D2: ROW2
          D3: ROW3
          D4: COL0
          D5: COL1
          D6: COL2
          D7: COL3
          D8: COL4
          D9: COL5
          D10: COL6
          D11: ENC_A
          D12: ENC_B
          D17: VIEW_MOSI
          D18: VIEW_CS
          D19: VIEW_SCK
          V3V3: 3V3
          GND: GND
          BATP: BAT_SW
      nice_view:
        what: kataware/nice_view
        where: left_c6_thumb
        adjust:                 # ピンを奥側 (XIAO・USB-C の近く) に向ける
          shift: [0, 2.5ky]
          rotate: 180
        params: &view_params
          MOSI: VIEW_MOSI
          SCK: VIEW_SCK
          VCC: 3V3
          GND: GND
          CS: VIEW_CS
      power_switch:       # 水平スライドスイッチ (内側の側面)。パッドが内向き・レバーが外向き
        what: lib/sw_spdt_pcm12   # KiCad 標準 SW_SPDT_PCM12 (Alps SSSS811101 と同じ形)
        where: left_c6_thumb
        adjust:
          shift: [0.5kx + 0.85, pwr_y]   # 固定用の足が基板の端から 0.3mm 以上内側に入る位置
          rotate: 90              # レバー (部品の +y 側) を基板の外 (右の側面) へ
        params:
          from: BAT_P
          to: BAT_SW
      # --- 浮島: 基板をトレイの柱に下から留める M2 はんだ付けナット (裏・8 か所。case/ukishima.py の柱と同じ位置) ---
      mount1: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [0.5kx, 0.5ky], params.side: B}
      mount2: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [1.5kx, 0.5ky], params.side: B}
      mount3: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [4.5kx, 0.5ky], params.side: B}
      mount4: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [5.5kx, 17], params.side: B}   # エンコーダーの真下 (足のあいだ)
      mount5: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [0.5kx, 2.5ky], params.side: B}
      mount6: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [1.5kx, 2.5ky], params.side: B}
      mount7: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [4.5kx, 2.5ky], params.side: B}
      mount8: {what: kataware/smt_nut_m2, where: left_c0_thumb, adjust.shift: [3.5kx, 1.5ky], params.side: B}
      battery:
        what: lib/molex_picoblade_2p   # Gexa GA-011 (1.25mm ピッチ)。浮島: ソケットのあいだの空き (電池のケーブルを基板の下で引き回す)
        where: left_c0_thumb
        adjust:
          shift: [48, 29]
          rotate: 0
        params:
          side: B
          pos: BAT_P
          neg: GND
  # ===================== 右手 =====================
  right:
    template: kicad8
    outlines:
      edge:
        outline: pcb_right
        layer: Edge.Cuts
    footprints:
      switch:
        what: kataware/choc_v2_hotswap
        where: /^right_/
        params: *switch_params
      diode:
        what: diode
        where: /^right_/
        adjust.shift: [2, -5]       # 右へ 2mm: スイッチの位置決め穴 (左下) をよける
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      trackball_header:   # PMW3610 センサーへのケーブルをつなぐ所 (基板の裏。ソケットのあいだの空き)
        what: lib/jst_sh_bm06b   # KiCad 標準 JST SH 6ピン (上から挿す)
        where: right_e_top
        adjust:
          shift: [27.95, -28.15]
          rotate: 180
        params:
          side: B
          P1: 3V3
          P2: GND
          P3: TB_SCLK
          P4: TB_SDIO
          P5: TB_NCS
          P6: TB_MOTION
      xiao:
        what: lib/xiao_nrf52840_plus
        where: right_e_top
        adjust:                 # 横向き。USB-C を内側の側面 (左) に出す
          shift: [-1.5kx + 8, xiao_y - 3ky]
          rotate: 180
        params:
          side: B
          D0: ROW0
          D1: ROW1
          D2: ROW2
          D3: ROW3
          D4: COL7
          D5: COL8
          D6: COL9
          D7: COL10
          D8: COL11
          D9: COL12
          D10: TB_SCLK
          D11: TB_NCS
          D12: TB_MOTION
          D13: TB_SDIO
          D17: VIEW_MOSI
          D18: VIEW_CS
          D19: VIEW_SCK
          V3V3: 3V3
          GND: GND
          BATP: BAT_SW
      nice_view:
        what: kataware/nice_view
        where: right_e_top
        adjust:
          shift: [-kx, -0.5ky]
          rotate: 180
        params: *view_params
      power_switch:
        what: lib/sw_spdt_pcm12   # KiCad 標準 SW_SPDT_PCM12 (Alps SSSS811101 と同じ形)
        where: right_e_top
        adjust:
          shift: [-1.5kx - 0.85, pwr_y - 3ky]
          rotate: -90             # レバーを基板の外 (左の側面) へ
        params:
          from: BAT_P
          to: BAT_SW
      # --- 浮島: 基板をトレイの柱に下から留める M2 はんだ付けナット (裏・8 か所。case/ukishima.py の柱と同じ位置) ---
      mount1: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [1.5kx, -2.5ky], params.side: B}
      mount2: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [3.5kx, -2.5ky], params.side: B}
      mount3: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [0.5kx, -1.5ky], params.side: B}
      mount4: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [0.5kx, -0.5ky], params.side: B}
      mount5: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [2.5kx, -0.5ky], params.side: B}
      mount6: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [4.5kx, -0.5ky], params.side: B}
      mount7: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [2.5kx, -1.5ky], params.side: B}
      mount8: {what: kataware/smt_nut_m2, where: right_e_top, adjust.shift: [4.5kx, -1.5ky], params.side: B}
      battery:
        what: lib/molex_picoblade_2p   # 浮島: ソケットのあいだの空き (電池のケーブルを基板の下で引き回す)
        where: right_c12_thumb
        adjust:
          shift: [-47.3, 10]
          rotate: 0
        params:
          side: B
          pos: BAT_P
          neg: GND
