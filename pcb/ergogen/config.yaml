# kataware — Ergogen 設定 (基板・プレートの下書き)
#
# 使い方:
#   npx ergogen@4.1.0 pcb/ergogen -o pcb/ergogen/output
#
# 座標の決まり:
#   - 1キー = 19.05mm (kx, ky)。y は上がプラス (Ergogen の決まり)
#   - 左手は Q の列・親指の段 (left_c0_thumb) が原点
#   - 右手は左手と重ならないよう x = rx の位置に置く
#
# スイッチは Kailh Choc v2 (ロープロファイル) のみ。ホットスワップ
# (MX と Choc はソケットの穴が重なり同じ基板に載せられないため、Choc に絞った)
#
# 部品データ:
#   footprints/kataware/  … kataware 用に作ったもの (販売可能。Ergogen 内蔵 (MIT) をもとにしたものを含む)
#   footprints/ceoloide/  … ceoloide/ergogen-footprints から取り込んだ MIT ライセンスのもの
#   footprints/box.js, header6.js … kataware 用の補助部品

meta:
  engine: 4.1.0
  name: kataware
  version: 0.1
  author: kyonccc

units:
  kx: 19.05
  ky: 19.05
  wall: 5        # ケースの縁
  corner: 14     # 外周の角の丸み
  rx: 200        # 右手の原点 (マイコン列の中心)

points:
  zones:
    # ===== 左手: 5列 x 4段 + T・G の右 (c5) + 親指の段の内側 (c5, c6) =====
    left:
      key:
        spread: kx
        padding: ky
        width: kx
        height: ky
      columns:
        c0.key.column_net: COL0
        c1.key.column_net: COL1
        c2.key.column_net: COL2
        c3.key.column_net: COL3
        c4.key.column_net: COL4
        c5:
          key.column_net: COL5
          rows.bottom.skip: true      # ここはエンコーダー
        c6:
          key.column_net: COL6
          rows:
            bottom.skip: true
            home.skip: true
            top.skip: true            # 親指の段 (Raise) だけ
      rows:
        thumb.row_net: ROW3
        bottom.row_net: ROW2
        home.row_net: ROW1
        top.row_net: ROW0

    # ===== 右手: Y・H の左 (e) + 5列 x 4段。e のさらに内側がマイコン列、その下がボール =====
    right:
      anchor.shift: [rx + kx, 0]
      key:
        spread: kx
        padding: ky
        width: kx
        height: ky
      columns:
        e:
          key.column_net: COL7
          rows:
            thumb.skip: true
            bottom.skip: true
        c8.key.column_net: COL8
        c9.key.column_net: COL9
        c10.key.column_net: COL10
        c11.key.column_net: COL11
        c12.key.column_net: COL12
      rows:
        thumb.row_net: ROW3
        bottom.row_net: ROW2
        home.row_net: ROW1
        top.row_net: ROW0

outlines:
  # --- 外形 (左右同じ大きさ) ---
  board_left:
    - what: rectangle
      where: left_c0_thumb
      adjust.shift: [3kx, 1.5ky]
      size: [7kx + 2wall, 4ky + 2wall]
      corner: corner
  board_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [2kx, -1.5ky]
      size: [7kx + 2wall, 4ky + 2wall]
      corner: corner

  # --- 穴・窓 ---
  ball_hole:            # ボールユニット (外径34mm) が通る穴。まわりにすき間1mm (ガスケットで基板が動いても当たらない)
    - what: circle
      where: right_e_top
      adjust.shift: [-0.5kx, -2.75ky]
      radius: 18
  encoder_cut:          # エンコーダー本体の逃げ (プレート用)
    - what: rectangle
      where: left_c5_top
      adjust.shift: [0.5kx, -2ky]
      size: [13, 13]
  view_window_left:     # nice!view の窓 (36 x 14mm + 余裕)
    - what: rectangle
      where: left_c6_thumb
      adjust.shift: [0, 2.5ky]
      size: [14.6, 36.6]
      corner: 1
  view_window_right:
    - what: rectangle
      where: right_e_top
      adjust.shift: [-kx, -0.5ky]
      size: [14.6, 36.6]
      corner: 1
  keys_choc:            # Choc v2 用プレートのスイッチ穴 (13.8mm 角)
    - what: rectangle
      where: true
      size: [13.8, 13.8]

  # --- 基板の外形 ---
  pcb_left:
    - name: board_left
  pcb_right:
    - name: board_right
    - operation: subtract
      name: ball_hole

  # --- プレート (キースイッチを固定する板) ---
  plate_left:
    - name: board_left
    - {operation: subtract, name: keys_choc}
    - {operation: subtract, name: encoder_cut}
    - {operation: subtract, name: view_window_left}
  plate_right:
    - name: board_right
    - {operation: subtract, name: keys_choc}
    - {operation: subtract, name: ball_hole}
    - {operation: subtract, name: view_window_right}

pcbs:
  # ===================== 左手 =====================
  left:
    template: kicad8
    outlines:
      edge:
        outline: pcb_left
        layer: Edge.Cuts
    footprints:
      switch:
        what: kataware/choc_v2_hotswap
        where: /^left_/
        params: &switch_params
          from: "{{column_net}}"
          to: "{{name}}"
      diode:
        what: diode
        where: /^left_/
        adjust.shift: [0, -5]
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      encoder:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: left_c5_top
        adjust.shift: [0.5kx, -2ky]
        params:
          S1: COL5
          S2: ENC_SW
          A: ENC_A
          B: GND
          C: ENC_B
      encoder_diode:
        what: diode
        where: left_c5_top
        adjust.shift: [0.5kx, -2ky - 9.2]
        params:
          from: ENC_SW
          to: ROW2
      xiao:               # 基板の裏側。KiCad で Seeed 公式フットプリントに置き換える (仮)
        what: kataware/xiao_plus_placeholder
        where: left_c6_thumb
        adjust.shift: [0, 3.5ky - 8]
        params:
          D0: ROW0
          D1: ROW1
          D2: ROW2
          D3: ROW3
          D4: COL0
          D5: COL1
          D6: COL2
          D7: COL3
          D8: COL4
          D9: COL5
          D10: COL6
          D11: ENC_A
          D12: ENC_B
          D17: VIEW_MOSI
          D18: VIEW_CS
          D19: VIEW_SCK
          V3V3: 3V3
          GND: GND
          BATP: BAT_SW
      nice_view:
        what: kataware/nice_view
        where: left_c6_thumb
        adjust:                 # ピンを奥側 (XIAO・USB-C の近く) に向ける
          shift: [0, 2.5ky]
          rotate: 180
        params: &view_params
          MOSI: VIEW_MOSI
          SCK: VIEW_SCK
          VCC: 3V3
          GND: GND
          CS: VIEW_CS
      power_switch:       # 水平スライドスイッチ (内側の側面)
        what: kataware/power_switch_placeholder
        where: left_c6_thumb
        adjust:
          shift: [0.5kx + 1.5, 3.5ky - 10]
          rotate: 90
        params:
          from: BAT_P
          to: BAT_SW
      battery:
        what: kataware/battery_125_placeholder   # Gexa GA-011 (1.25mm ピッチ)。KiCad で PicoBlade に置き換え
        where: left_c0_thumb
        adjust.shift: [0.5kx, 0.5ky]
        params:
          side: B
          pos: BAT_P
          neg: GND
  # ===================== 右手 =====================
  right:
    template: kicad8
    outlines:
      edge:
        outline: pcb_right
        layer: Edge.Cuts
    footprints:
      switch:
        what: kataware/choc_v2_hotswap
        where: /^right_/
        params: *switch_params
      diode:
        what: diode
        where: /^right_/
        adjust.shift: [0, -5]
        params:
          from: "{{name}}"
          to: "{{row_net}}"
      trackball_header:   # PMW3610 センサーへのケーブルをつなぐ所 (ボールの穴のすぐ上)
        what: header6
        where: right_e_top
        adjust.shift: [-0.5kx, -2.75ky + 20.5]
        params:
          P1: 3V3
          P2: GND
          P3: TB_SCLK
          P4: TB_SDIO
          P5: TB_NCS
          P6: TB_MOTION
      xiao:
        what: kataware/xiao_plus_placeholder
        where: right_e_top
        adjust.shift: [-kx, 0.5ky - 8]
        params:
          D0: ROW0
          D1: ROW1
          D2: ROW2
          D3: ROW3
          D4: COL7
          D5: COL8
          D6: COL9
          D7: COL10
          D8: COL11
          D9: COL12
          D10: TB_SCLK
          D11: TB_NCS
          D12: TB_MOTION
          D13: TB_SDIO
          D17: VIEW_MOSI
          D18: VIEW_CS
          D19: VIEW_SCK
          V3V3: 3V3
          GND: GND
          BATP: BAT_SW
      nice_view:
        what: kataware/nice_view
        where: right_e_top
        adjust:
          shift: [-kx, -0.5ky]
          rotate: 180
        params: *view_params
      power_switch:
        what: kataware/power_switch_placeholder
        where: right_e_top
        adjust:
          shift: [-1.5kx - 1.5, 0.5ky - 10]
          rotate: -90
        params:
          from: BAT_P
          to: BAT_SW
      battery:
        what: kataware/battery_125_placeholder
        where: right_c12_thumb
        adjust.shift: [-0.5kx, 0.5ky]
        params:
          side: B
          pos: BAT_P
          neg: GND
